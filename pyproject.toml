[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama31-kaggle-finetune"
version = "0.1.0"
description = "Llama 3.1 8B QLoRA training and per-task evaluation on Kaggle T4 x 2"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
